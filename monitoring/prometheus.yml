global:
  scrape_interval: 15s  # Good interval for responsive monitoring

scrape_configs:
  - job_name: 'prometheus'  # Self-monitoring
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'interstellar-api-ecs'  # ECS ALB metrics
    metrics_path: /metrics
    static_configs:
      - targets: ['interstellar-alb-1254490069.us-east-1.elb.amazonaws.com']

  - job_name: 'interstellar-api-local'  # Local dev metrics (FastAPI)
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:8000']

  - job_name: 'node'  # System-level node exporter (macOS)
    static_configs:
      - targets: ['localhost:9100']

  - job_name: 'mac-metrics'  # Optional macOS metrics
    static_configs:
      - targets: ['localhost:9182']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']