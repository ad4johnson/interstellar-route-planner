global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'app'
    static_configs:
      - targets: ['localhost:8000']

  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']

  - job_name: 'local-mac'
    static_configs:
      - targets: ['localhost:9182']

  - job_name: 'interstellar-metrics'
    static_configs:
      - targets: ['localhost:8000']

  - job_name: 'fastapi'
    static_configs:
      - targets: ['localhost:8000']


