global:
  scrape_interval: 15s  # Good interval for responsive monitoring

scrape_configs:
  - job_name: 'prometheus'  # Self-monitoring
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'interstellar-api'
    static_configs:
      - targets: ['api.interstellar.local:8888']  # Local dev metrics (FastAPI)

  - job_name: 'interstellar-api-ecs'  # ECS ALB metrics (!!! UPDATE THIS)
    metrics_path: /metrics
    static_configs:
      - targets: ['interstellar-alb-1254490069.us-east-1.elb.amazonaws.com:80']

  - job_name: 'interstellar-api-local'  # Local dev metrics (FastAPI)
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8000']  # Optional: avoid localhost in docker

  - job_name: 'node'  # System-level node exporter (macOS local)
    static_configs:
      - targets: ['localhost:9100']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']