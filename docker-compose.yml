version: '3.7'

services:
  postgres:
    image: postgres:15
    container_name: interstellar-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-default_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-default_password}
      POSTGRES_DB: ${POSTGRES_DB:-default_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      retries: 5

  app:
    build: .
    container_name: interstellar-route-planner-app
    depends_on:
      postgres:
        condition: service_healthy  # Ensures API starts ONLY when DB is ready
    environment:
      DB_HOST: ${DB_HOST:-localhost}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-default_db}
      DB_USER: ${DB_USER:-default_user}
      DB_PASSWORD: ${DB_PASSWORD:-default_password}
      DATABASE_URL: ${DATABASE_URL:-postgresql://default_user:default_password@localhost:5432/default_db}
    ports:
      - "8000:8000"
    
    command: sh -c "until pg_isready -h ${DB_HOST} -p ${DB_PORT} -U ${DB_USER}; do echo 'Waiting for database...'; sleep 5; done; echo 'Database is ready. Running migrations...'; npx knex migrate:latest; echo 'Migrations complete. Starting API...'; uvicorn app.main:app --host 0.0.0.0 --port 8000"

  prometheus:
    image: prom/prometheus
    container_name: interstellar-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  grafana_data: