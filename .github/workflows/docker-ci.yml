name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: interstellar_route_planner
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests

      - name: Start API Server in Background
        run: |
          python main.py &
          sleep 10

      - name: Wait for API to be Ready
        run: |
          for i in {1..10}; do
            if curl --silent --fail http://localhost:8000/health; then
              echo "✅ API is up!"
              exit 0
            fi
            echo "⏳ Waiting for API..."
            sleep 10
          done
          exit 1

      - name: Run Tests
        run: pytest tests/test_api.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ad4johnson/interstellar-route-planner:v1.${{ github.run_number }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Fetch AWS Credentials from SSM (Ensure the correct parameter names)
      - name: Fetch AWS Credentials from SSM
        run: |
          export AWS_ACCESS_KEY_ID=$(aws ssm get-parameter --name "/interstellar/aws-access-key-id" --with-decryption --query "Parameter.Value" --output text)
          export AWS_SECRET_ACCESS_KEY=$(aws ssm get-parameter --name "/interstellar/aws-secret-access-key" --with-decryption --query "Parameter.Value" --output text)
          echo "AWS credentials fetched successfully"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-region: us-east-1

      - name: Register New Task Definition in ECS (Ensure you're using SSM params in ECS task definition)
        run: |
          aws ecs register-task-definition --cli-input-json file://ecs-task-definition.json

      - name: Update ECS Service with SSM Parameters (Deploy the service with updated secrets)
        run: |
          aws ecs update-service --cluster interstellar-cluster --service interstellar-service --force-new-deployment
          echo "✅ ECS Service updated with latest secrets"

  terraform:
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.4.0  # Specify the Terraform version

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file=terraform/terraform.tfvars

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'  # Only apply on push to main
        run: terraform apply -auto-approve -var-file=terraform/terraform.tfvars
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1